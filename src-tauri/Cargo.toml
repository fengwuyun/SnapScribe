[package]
name = "snapscribe"
version = "0.1.0"
description = "Local video/audio to text transcription tool"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
